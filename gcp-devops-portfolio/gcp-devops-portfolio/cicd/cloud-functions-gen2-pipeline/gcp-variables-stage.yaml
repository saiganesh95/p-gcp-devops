project:
  project_id: "example-stage-project"
  region: "asia-south1"
  runtime: "python311"
  memory_mb: 512
  timeout_sec: 60
  max_instances_default: 10
  service_account: "cf-runtime@example-stage-project.iam.gserviceaccount.com"
  vpc_connector: "projects/example-stage-project/locations/asia-south1/connectors/vpc-con-stage"

functions:
  - name: "order-sync-fn"
    source_dir: "functions/order_sync"
    entry_point: "handle_request"
    trigger: "http"
    min_instances: 1
    max_instances: 20
    env_vars:
      LOG_LEVEL: "INFO"

  - name: "report-scheduler-fn"
    source_dir: "functions/report_scheduler"
    entry_point: "handle_pubsub"
    trigger: "pubsub"
    trigger_topic: "report-schedule-trigger"
    env_vars:
      LOG_LEVEL: "INFO"

  - name: "notify-fn"
    source_dir: "functions/notify_service"
    entry_point: "handle_request"
    trigger: "http"
    memory_mb: 1024
    env_vars:
      LOG_LEVEL: "WARNING"
